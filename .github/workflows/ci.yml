name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: pytest + pyright (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python-version }}
      # The npx tests run in their own job: they download an MCP server from
      # npm, and a registry hiccup should not be reported as a broken build on
      # three interpreters at once.
      - run: uv run pytest -m 'not needs_npx'
      - run: uv run pyright

  integration:
    name: against a real MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -m needs_npx
