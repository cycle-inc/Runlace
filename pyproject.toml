[project]
name = "runlace"
version = "0.1.0"
description = "Deterministic, replayable workflows over your MCP servers."
readme = "README.md"
authors = [{ name = "Runlace contributors" }]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "agents", "workflows", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.5",
    "mcp>=2.1",
    "pydantic>=2.7",
    "pyright>=1.1.390",
    "pyyaml>=6.0.3",
    "typer>=0.12",
    # TypedDicts built at run time must come from typing_extensions for pydantic
    # to validate them on Python 3.11.
    "types-pyyaml>=6.0.12.20260815",
    "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/cycle-inc/Runlace"
Repository = "https://github.com/cycle-inc/Runlace"
Issues = "https://github.com/cycle-inc/Runlace/issues"

[project.scripts]
runlace = "runlace.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "uvicorn>=0.30",  # serves the streamable-HTTP test server
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runlace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_npx: requires npx on PATH to run a real MCP stdio server",
]

[tool.pyright]
# Runlace's own source is checked in standard mode. Strict is reserved for the
# two places the spec requires it: the generated stubs and, from M2, workflow
# files.
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
