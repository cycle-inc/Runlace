[project]
name = "runlace"
version = "0.1.0"
description = "Deterministic, replayable workflows over your MCP servers."
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.5",
    "mcp>=2.1",
    "pydantic>=2.7",
    "pyright>=1.1.390",
    "typer>=0.12",
]

[project.scripts]
runlace = "runlace.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "uvicorn>=0.30",  # serves the streamable-HTTP test server
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runlace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_npx: requires npx on PATH to run a real MCP stdio server",
]

[tool.pyright]
# Runlace's own source is checked in standard mode. Strict is reserved for the
# two places the spec requires it: the generated stubs and, from M2, workflow
# files.
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
